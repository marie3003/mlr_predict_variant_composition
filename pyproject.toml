[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "viral-variant-comp"
version = "0.1.0"
description = "Tools for estimating variant growth dynamics from lineage count data."
readme = "Readme.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Marie Becker" }
]
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "matplotlib",
  "plotly",
  "seaborn",
]

[project.scripts]
viral-variant-comp = "viral_variant_comp.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
exclude = ["data*", "figures*", "notebooks*", "scripts*"]
